name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 https://github.com/pnpm/action-setup/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 https://github.com/actions/setup-node/releases/tag/v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 https://github.com/pnpm/action-setup/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 https://github.com/actions/setup-node/releases/tag/v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ponder uses virtual modules (ponder:registry, ponder:api) that cannot
      # be resolved by standalone tsc, so we only typecheck the @repo/* packages
      # and the client apps.
      - run: pnpm typecheck:packages
      - run: pnpm typecheck:liquidator
      - run: pnpm typecheck:arbitrageur

  test:
    runs-on: ubuntu-latest

    # The crash-safety / no-double-submit guarantee rests on the Postgres StateStore. The unit
    # tests exercise an in-memory model, which cannot catch a schema, transaction or upsert bug —
    # so CI runs the integration suites against a real database. They self-skip when
    # PERSISTENCE_E2E_DATABASE_URL is unset, which keeps `pnpm test` offline for contributors.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ponder
          POSTGRES_PASSWORD: ponder
          POSTGRES_DB: ponder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PERSISTENCE_E2E_DATABASE_URL: postgresql://ponder:ponder@localhost:5432/ponder

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 https://github.com/pnpm/action-setup/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 https://github.com/actions/setup-node/releases/tag/v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test (unit + Postgres integration suites)
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/test.log

          # The integration suites self-skip when the DB is unreachable. That is right for a
          # contributor's laptop and wrong for CI: a typo in the env var, a renamed file, or a
          # container that never came up would turn the crash-safety coverage into a silent no-op.
          if grep -qE "(postgres|crashSafety)\.integration.*skipped" /tmp/test.log; then
            echo "::error::Postgres integration tests skipped despite PERSISTENCE_E2E_DATABASE_URL being set"
            grep -E "integration" /tmp/test.log || true
            exit 1
          fi
          grep -qE "integration\.test" /tmp/test.log || {
            echo "::error::no Postgres integration suite ran at all"; exit 1;
          }

  # The Solidity side. These exercise `LiquidationRouter` + `UniswapV4SwapVenue` against a pinned
  # Sepolia fork — the only coverage that runs the flash-funding path against real venues, real pool
  # liquidity and a real liquidatable position. Nothing else in CI compiles or runs the contracts.
  fork-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 https://github.com/actions/checkout/releases/tag/v6.0.2

      - name: Checkout submodules (private repo)
        env:
          GITHUB_TOKEN: ${{ secrets.VAULT_REPOS_RO }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0 https://github.com/foundry-rs/foundry-toolchain/releases/tag/v1.8.0

      # The fork tests pin their blocks, so the state they read is identical on every run and can be
      # served from disk instead of the network. Measured on this suite: 45s cold, 1.6s warm, from a
      # ~130KB cache. Keyed on TestSuites.sol because that is where the pinned blocks live — change a
      # block and the key changes with it, so a stale cache can never mask a moved fixture.
      - name: Cache forked RPC state
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0 https://github.com/actions/cache/releases/tag/v4.2.0
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ hashFiles('test/fork/base/TestSuites.sol') }}
          restore-keys: foundry-rpc-

      - name: Build contracts
        run: forge build

      - name: Fork tests
        env:
          # The secret is optional: the pinned blocks need archive state, and the free public default
          # serves them. It is also fetched rarely — the cache above holds the whole of what these
          # tests read (~150KB), so the network is touched on a cold cache and not again. Set the
          # secret only if that cold path proves flaky. (`publicnode` 403s on archive reads; `drpc`
          # does not.)
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC || 'https://sepolia.drpc.org' }}
        run: |
          set -o pipefail
          forge test --match-path 'test/fork/**' -vv 2>&1 | tee /tmp/fork.log

          # `--match-path` matching nothing is a pass, not a failure, so a moved or renamed file
          # would silently take the whole suite out of CI. Assert the tests actually ran.
          grep -qE '^\[PASS\] test_UNISWAPV4_LIQUIDATION_MIN_PROFIT_FLOOR' /tmp/fork.log || {
            echo "::error::the min-profit floor fork test did not run — it is the only proof the profit guard works"
            exit 1
          }
