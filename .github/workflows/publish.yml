name: docker_publish

on:
  push:
    # '**' and not '*': a single-star glob does not cross '/', so branches
    # like GAtom22/reorg-2 silently skipped publishing entirely.
    branches:
    - '**'
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: read

# Only pull request runs share a group, so a new push to a PR cancels its
# superseded run. Every other run gets its own group and is never cancelled
# or replaced, as without a concurrency block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two images, matching the production architecture proposal: one bot service
# (the arbitrageur composition root, which also runs the liquidation engine
# when ADAPTER_ADDRESS+LENS_ADDRESS are set) and one mode-gated ponder
# indexer. The standalone liquidator entrypoint stays in the repo for local
# runs but is not published as an image.
jobs:
  docker_bots_indexer:
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    with:
      publish: true
      dockerfile: ./docker/ponder.Dockerfile
      repoName: aave-bots-indexer
      push_to_dockerhub: false
    permissions:
      contents: read
      id-token: write
      security-events: write
      packages: read

  docker_bots_svc:
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    with:
      publish: true
      dockerfile: ./docker/arbitrageur.Dockerfile
      repoName: aave-bots-svc
      push_to_dockerhub: false
    permissions:
      contents: read
      id-token: write
      security-events: write
      packages: read
