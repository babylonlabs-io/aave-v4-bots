[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
auto_detect_solc = true

# `test/utils` is a symlink to lib/tbv-contracts/test/utils that the e2e runner and CI create at
# runtime, because PopHelpers' FFI *node* scripts resolve the relative path `test/utils/`. Solidity
# never reaches those files that way — its imports go through the `test-utils/` remapping below —
# but forge still compiles whatever it finds under `test`, and their relative
# `../../src/protocol/...` imports then resolve against this repo's root, which has no
# `src/protocol`. Without this skip, `forge build` and `forge test` fail after any e2e run until the
# symlink is deleted.
skip = ["test/utils/**"]

# Compiler optimizations to match contracts repo
optimizer = true
optimizer_runs = 200
via_ir = true  # Use IR-based code generator to avoid stack too deep errors

# Remappings to import from contracts submodule
remappings = [
    "forge-std/=lib/tbv-contracts/lib/forge-std/src/",
    "vault-contracts/=lib/tbv-contracts/src/",
    "aave-v4/=lib/tbv-contracts/lib/aave-v4/src/",
    "@openzeppelin/contracts-upgradeable/=lib/tbv-contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/tbv-contracts/lib/openzeppelin-contracts/contracts/",
    "src/spoke/=lib/tbv-contracts/lib/aave-v4/src/spoke/",
    "src/libraries/=lib/tbv-contracts/lib/aave-v4/src/libraries/",
    "src/hub/=lib/tbv-contracts/lib/aave-v4/src/hub/",
    "src/dependencies/=lib/tbv-contracts/lib/aave-v4/src/dependencies/",
    "src/utils/=lib/tbv-contracts/lib/aave-v4/src/utils/",
    "src/interfaces/INoncesKeyed.sol=lib/tbv-contracts/lib/aave-v4/src/interfaces/INoncesKeyed.sol",
    "src/interfaces/IMulticall.sol=lib/tbv-contracts/lib/aave-v4/src/interfaces/IMulticall.sol",
    "src/interfaces/IIntentConsumer.sol=lib/tbv-contracts/lib/aave-v4/src/interfaces/IIntentConsumer.sol",
    "src/interfaces/IExtSload.sol=lib/tbv-contracts/lib/aave-v4/src/interfaces/IExtSload.sol",
    "src/access/=lib/tbv-contracts/lib/aave-v4/src/access/",
    "script/utils/=lib/tbv-contracts/script/utils/",
    "lib/aave-v4/=lib/tbv-contracts/lib/aave-v4/",
    "test-utils/=lib/tbv-contracts/test/utils/",
    "test-e2e-base/=lib/tbv-contracts/test/e2e/base/"
]

# E2E test profile - requires Bitcoin regtest and Postgres running
# Run with: FOUNDRY_PROFILE=e2e forge test --match-path 'test/e2e/**/*.sol'
[profile.e2e]
ffi = true  # Enable FFI for bot/ponder process management and Bitcoin CLI
fs_permissions = [
    { access = "read-write", path = "./lib/tbv-contracts/test/data" },
    { access = "read-write", path = "./test/e2e/data" },
    { access = "read-write", path = "./lib/tbv-contracts/deployments" },
    { access = "read-write", path = "./" }  # Allow creating .env file in root
]
gas_snapshot_check = false
gas_limit = "max"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"