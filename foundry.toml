[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
auto_detect_solc = true

# Compiler optimizations to match contracts repo
optimizer = true
optimizer_runs = 200
via_ir = true  # Use IR-based code generator to avoid stack too deep errors

# Remappings to import from contracts submodule
remappings = [
    "forge-std/=lib/contracts/lib/forge-std/src/",
    "vault-contracts/=lib/contracts/src/",
    "aave-v4/=lib/contracts/lib/aave-v4/src/",
    "@openzeppelin/contracts-upgradeable/=lib/contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/contracts/lib/openzeppelin-contracts/contracts/",
    "src/spoke/=lib/contracts/lib/aave-v4/src/spoke/",
    "src/libraries/=lib/contracts/lib/aave-v4/src/libraries/",
    "src/hub/=lib/contracts/lib/aave-v4/src/hub/",
    "src/dependencies/=lib/contracts/lib/aave-v4/src/dependencies/",
    "src/utils/=lib/contracts/lib/aave-v4/src/utils/",
    "src/interfaces/INoncesKeyed.sol=lib/contracts/lib/aave-v4/src/interfaces/INoncesKeyed.sol",
    "src/interfaces/IMulticall.sol=lib/contracts/lib/aave-v4/src/interfaces/IMulticall.sol",
    "src/interfaces/IIntentConsumer.sol=lib/contracts/lib/aave-v4/src/interfaces/IIntentConsumer.sol",
    "src/interfaces/IExtSload.sol=lib/contracts/lib/aave-v4/src/interfaces/IExtSload.sol",
    "src/access/=lib/contracts/lib/aave-v4/src/access/",
    "script/utils/=lib/contracts/script/utils/",
    "lib/aave-v4/=lib/contracts/lib/aave-v4/",
    "test-utils/=lib/contracts/test/utils/",
    "test-e2e-base/=lib/contracts/test/e2e/base/"
]

# E2E test profile - requires Bitcoin regtest and Postgres running
# Run with: FOUNDRY_PROFILE=e2e forge test --match-path 'test/e2e/**/*.sol'
[profile.e2e]
ffi = true  # Enable FFI for bot/ponder process management and Bitcoin CLI
fs_permissions = [
    { access = "read-write", path = "./contracts/test/data" },
    { access = "read-write", path = "./test/e2e/data" },
    { access = "read-write", path = "./contracts/deployments" },
    { access = "read-write", path = "./" }  # Allow creating .env file in root
]
gas_snapshot_check = false
gas_limit = "max"
